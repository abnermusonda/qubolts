[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qubolts"
version = "0.1.0"
description = "Quantum-ready decision engines for adtech and martech: QUBO resolvers with swappable classical, quantum-inspired and quantum backends."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Abner Musonda" }]
keywords = ["qubo", "quantum", "annealing", "adtech", "martech", "optimization", "advertising"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Office/Business",
]
dependencies = [
  "dimod>=0.12",
  "dwave-samplers>=1.2",
  "numpy>=1.24",
]

[project.optional-dependencies]
# D-Wave Leap hybrid solvers and QPUs (needs a Leap API token)
leap = ["dwave-system>=1.24"]
# Fabric / Databricks / any Spark runtime for the coefficient-building jobs
spark = ["pyspark>=3.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/qubolts/qubolts"
Issues = "https://github.com/qubolts/qubolts/issues"

[project.scripts]
qubolts-bench = "qubolts.bench:main"

[tool.hatch.build.targets.wheel]
packages = ["qubolts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
